<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מאפיית נחמה - חוות דעת</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #262626;
            --accent-gold: #d4af37;
            --gold-hover: #f3e5ab;
            --text-color: #f5f5f5;
            --subtext-color: #a3a3a3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
            padding: 40px 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .challah-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .challah-icon svg {
            width: 100%;
            height: 100%;
            fill: var(--accent-gold);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 15px;
            color: var(--subtext-color);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-google {
            background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
            color: #121212;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            border: none;
        }

        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            background: linear-gradient(135deg, #e5be48 0%, #bb931b 100%);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: var(--subtext-color);
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- אייקון חלה זהב -->
        <div class="challah-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M19.5 8.5c-.83 0-1.5.67-1.5 1.5 0 .39.15.74.39 1.01C17.43 11.41 16 12.08 16 14c0 1.92 1.43 2.59 2.39 2.99-.24.27-.39.62-.39 1.01 0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5c0-.39-.15-.74-.39-1.01.96-.4 2.39-1.07 2.39-2.99 0-1.92-1.43-2.59-2.39-2.99.24-.27.39-.62.39-1.01 0-.83-.67-1.5-1.5-1.5zM12 4.5c-.83 0-1.5.67-1.5 1.5 0 .39.15.74.39 1.01C9.93 7.41 8.5 8.08 8.5 10c0 1.92 1.43 2.59 2.39 2.99-.24.27-.39.62-.39 1.01 0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5c0-.39-.15-.74-.39-1.01.96-.4 2.39-1.07 2.39-2.99 0-1.92-1.43-2.59-2.39-2.99.24-.27.39-.62.39-1.01 0-.83-.67-1.5-1.5-1.5zm-7.5 4c-.83 0-1.5.67-1.5 1.5 0 .39.15.74.39 1.01C2.43 11.41 1 12.08 1 14c0 1.92 1.43 2.59 2.39 2.99-.24.27-.39.62-.39 1.01 0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5c0-.39-.15-.74-.39-1.01.96-.4 2.39-1.07 2.39-2.99 0-1.92-1.43-2.59-2.39-2.99.24-.27.39-.62.39-1.01 0-.83-.67-1.5-1.5-1.5z"/>
            </svg>
        </div>

        <h1>מאפיית נחמה</h1>
        <p class="subtitle">נהניתם מהמאפים והשירות שלנו?<br>נשמח מאוד לשמוע את דעתכם!</p>

        <!-- כפתור ביקורת לגוגל -->
        <!-- השתל בתוך ה-href את הקישור הישיר לביקורת גוגל של המאפייה -->

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.38-.27-2.05-.49-.83-.27-1.49-.42-1.43-.89.03-.25.38-.51 1.07-.79 4.19-1.82 6.98-3.02 8.37-3.6 3.98-1.66 4.81-1.95 5.35-1.96.12 0 .38.03.55.17.14.12.18.28.2.45-.02.07-.02.21-.04.38z"/>
            </svg>
            אשמח לדרג בגוגל ⭐⭐⭐⭐⭐
        </a>

        <!-- כפתור אינסטגרם -->

            אינסטגרם
        </a>

        <!-- כפתור חיוג טלפוני -->
        <a href="tel:0500000000" class="btn btn-secondary">
            התקשרו אלינו
        </a>

        <footer>
            מאפיית נחמה &copy; כל הזכויות שמורות
        </footer>
    </div>

</body>
</html>
