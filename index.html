<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מאפיית נחמה - חוות דעת</title>
    <style>
        :root {
            --accent-gold: #d4af37;
            --gold-hover: #f3e5ab;
            --dark-green: #0b1f14;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--dark-green);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* חלק 1: עמוד ראשון - לוגו בלבד + כפתור גלילה */
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            position: relative;
            text-align: center;
            padding: 20px;
        }

        .logo-img {
            max-width: 280px;
            width: 80%;
            height: auto;
            margin-bottom: 40px;
        }

        .scroll-btn {
            position: absolute;
            bottom: 40px;
            background: linear-gradient(135deg, #0b1f14 0%, #173d28 100%);
            color: var(--accent-gold);
            padding: 16px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: bounce 2s infinite;
        }

        .scroll-btn:hover {
            transform: translateY(-3px);
            background: var(--accent-gold);
            color: var(--dark-green);
        }

        /* חלק 2: עמוד דירוגים + כפתורים */
        .content-section {
            min-height: 100vh;
            background: linear-gradient(rgba(11, 31, 20, 0.75), rgba(11, 31, 20, 0.85)), 
                        url('cake_background.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            background: rgba(19, 46, 32, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        h2 {
            color: var(--accent-gold);
            font-size: 26px;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 15px;
            color: #d1dcd6;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            margin-bottom: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-google {
            background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
            color: #121212;
            border: none;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-google:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #e5be48 0%, #bb931b 100%);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>

    <!-- חלק 1: לוגו נחמה בלבד -->
    <section class="hero-section">
        <img src="logo.png" alt="מאפיית נחמה" class="logo-img">
        
        <a href="#review-section" class="scroll-btn">
            כדי לדרג אותנו לחצו פה 👇
        </a>
    </section>

    <!-- חלק 2: עמוד הדירוגים והרשתות -->
    <section id="review-section" class="content-section">
        <div class="card-container">
            <h2>מאפיית נחמה</h2>
            <p class="subtitle">נהניתם מהמאפים והשירות שלנו?<br>נשמח מאוד לשמוע את דעתכם!</p>

            <!-- כפתור ביקורת לגוגל עם ה-Place ID המדויק של אפרת -->
            <a href="https://search.google.com/local/writereview?placeid=ChIJ2XO8DB7fAhURAnCDgE4r95g" target="_blank" class="btn btn-google">
                אשמח לדרג בגוגל ⭐⭐⭐⭐⭐
            </a>

            <!-- אינסטגרם -->
            <a href="https://www.instagram.com/nechama.bakery?srtk=MWJzbWo3c2tkZnN4" target="_blank" class="btn btn-secondary">
                אינסטגרם
            </a>

            <!-- פייסבוק -->
            <a href="https://www.facebook.com/share/14uaWWxbTSY/" target="_blank" class="btn btn-secondary">
                פייסבוק
            </a>

            <!-- וואטסאפ -->
            <a href="https://wa.me/972526331141" target="_blank" class="btn btn-secondary">
                וואטסאפ
            </a>
        </div>
    </section>

</body>
</html>
